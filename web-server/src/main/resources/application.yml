  compression:
    enabled: true
    mime-types: text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json
    min-response-size: 1024 # 最小压缩大小，单位为字节
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/voyage-bi
    username: root
    password: root
  data:
    redis:
      host: localhost  # Redis服务器地址
      port: 6380       # 默认端口
      password:        #
      database: 0      # 使用的数据库索引
      lettuce:
        pool:
          max-active: 8    # 连接池最大连接数
          max-idle: 8      # 连接池最大空闲连接数
          min-idle: 0      # 连接池最小空闲连接数
